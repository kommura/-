<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>オンライン絵しりとりゲーム</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
    }

    #gameContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #drawingCanvas {
        border: 2px solid #333;
        background-color: #fff;
    }

    #controls {
        margin-top: 10px;
    }
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="drawingCanvas" width="800" height="600"></canvas>
    <div id="controls">
        <button onclick="clearCanvas()">クリア</button>
        <label for="colorPicker">色選択:</label>
        <input type="color" id="colorPicker" value="#000000">
        <label for="brushSize">ブラシサイズ:</label>
        <input type="range" id="brushSize" min="1" max="50" value="5">
    </div>
    <form action="submit_drawing.php" method="POST">
        <input type="hidden" name="drawing_data" id="drawing_data">
        <button type="submit" onclick="saveDrawing()">送信</button>
    </form>
</div>
<script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const brushSize = document.getElementById('brushSize');

    let drawing = false;

    canvas.addEventListener('mousedown', (e) => {
        drawing = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
    });

    canvas.addEventListener('mousemove', (e) => {
        if (drawing) {
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        }
    });

    canvas.addEventListener('mouseup', () => {
        drawing = false;
        ctx.closePath();
    });

    canvas.addEventListener('mouseout', () => {
        drawing = false;
        ctx.closePath();
    });

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    colorPicker.addEventListener('change', (e) => {
        ctx.strokeStyle = e.target.value;
    });

    brushSize.addEventListener('input', (e) => {
        ctx.lineWidth = e.target.value;
    });

    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = brushSize.value;

    function saveDrawing() {
        const dataURL = canvas.toDataURL();
        document.getElementById('drawing_data').value = dataURL;
    }

    // Initialize canvas background
    clearCanvas();
</script>
</body>
</html>
